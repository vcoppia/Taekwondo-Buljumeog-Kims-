<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#f0f0f0;min-height:100vh;overscroll-behavior:none}
:root{--red:#e63946;--gold:#f4c430;--dark:#0a0a0a;--card:#181818;--card2:#222;--border:#2a2a2a;--muted:#777;--green:#22c55e;--blue:#3b82f6;--r:14px}
input,select,textarea{font-family:inherit;font-size:15px;background:#111;color:#f0f0f0;border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;width:100%;outline:none;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--red)}
select option{background:#111}
button{cursor:pointer;font-family:inherit;border:none;outline:none}
.hidden{display:none!important}
#bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.tab-btn{padding:10px 0 14px;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;border-top:2px solid transparent;font-size:10px;font-weight:600}
.tab-btn.active{color:var(--red);border-top-color:var(--red)}
#header{background:#111;position:sticky;top:0;z-index:40;border-bottom:1px solid var(--border);padding:10px 14px}
.header-inner{display:flex;align-items:center;gap:9px}
.logo-img{width:40px;height:40px;border-radius:10px;background:#222;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden;cursor:pointer}
.logo-img img{width:100%;height:100%;object-fit:cover}
#content{padding:14px 14px 88px}
.card{background:var(--card);border-radius:var(--r);padding:14px 15px;border:1px solid var(--border);margin-bottom:10px}
.card2{background:var(--card2);border-radius:12px;padding:12px 14px}
.stats-row{display:grid;gap:9px;margin-bottom:14px}
.stat-box{background:var(--card);border-radius:12px;padding:13px 10px;border:1px solid var(--border);text-align:center}
.stat-n{font-size:28px;font-weight:800;line-height:1}
.stat-l{font-size:10px;color:var(--muted);margin-top:3px;font-weight:600}
.tag{display:inline-flex;align-items:center;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;white-space:nowrap}
.btn{border-radius:12px;padding:13px 18px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-bottom:8px;border:none}
.btn-red{background:var(--red);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-wa{background:#25d366;color:#fff}
.btn-outline{background:transparent;color:var(--muted);border:1.5px solid var(--border)}
.btn-outline-red{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.overlay{position:fixed;inset:0;background:#000c;z-index:100;display:flex;align-items:flex-end}
.modal{background:var(--card);width:100%;max-height:93vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 16px 44px;-webkit-overflow-scrolling:touch}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.mt{font-size:21px;font-weight:800}
.mc{background:#2a2a2a;border-radius:50%;width:30px;height:30px;color:#aaa;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.item{background:var(--card);border-radius:var(--r);padding:13px 14px;border:1px solid var(--border);margin-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:12px}
.cin{border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:800;text-align:center;line-height:1.2;flex-shrink:0}
.gtabs{display:flex;gap:8px;margin-bottom:14px}
.gtab{flex:1;padding:10px;border-radius:11px;font-weight:700;font-size:13px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);text-align:center}
.gtab.active{background:var(--red);color:#fff;border-color:var(--red)}
.srow{display:flex;gap:8px;margin-bottom:12px}
.srow input{flex:1}
.addbtn{background:var(--red);border-radius:11px;padding:0 15px;color:#fff;font-weight:700;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:4px}
.popts{display:flex;gap:5px;margin-top:9px}
.popt{flex:1;padding:8px 3px;border-radius:9px;font-size:10px;font-weight:700;border:1.5px solid var(--border);background:var(--card2);color:var(--muted);text-align:center;line-height:1.4}
.pg{background:#22c55e18;color:var(--green);border-color:var(--green)}
.po{background:#f59e0b18;color:#f59e0b;border-color:#f59e0b}
.pr{background:#e6394618;color:var(--red);border-color:var(--red)}
.ebig{font-size:40px;font-weight:800;line-height:1}
.div{height:1px;background:var(--border);margin:14px 0}
#sede-bar{background:#0f0f0f;border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#sede-bar::-webkit-scrollbar{display:none}
.sede-chip{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;border:1.5px solid var(--border);background:var(--card);color:var(--muted);white-space:nowrap;flex-shrink:0}
.sede-chip.active{background:var(--red);color:#fff;border-color:var(--red)}
.sede-add{width:32px;height:32px;border-radius:50%;background:var(--card2);border:1.5px dashed var(--border);color:var(--muted);font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dias-check{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.dia-btn{padding:8px 12px;border-radius:9px;font-size:12px;font-weight:700;border:1.5px solid var(--border);background:var(--card2);color:var(--muted)}
.dia-btn.on{background:var(--red);color:#fff;border-color:var(--red)}
.wa-item{background:var(--card);border-radius:var(--r);padding:12px 14px;border:1px solid var(--border);margin-bottom:8px;display:flex;align-items:center;gap:12px}
#loading-screen{position:fixed;inset:0;background:#0a0a0a;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.spinner{width:40px;height:40px;border:3px solid #333;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#sync-bar{height:3px;background:var(--red);position:fixed;top:0;left:0;right:0;z-index:400;opacity:0;transition:opacity .3s}
#sync-bar.on{opacity:1}
</style>
</head>

      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>

<script>
const CIN=["Blanco","Blanco-Amarillo","Amarillo","Amarillo-Verde","Verde","Verde-Azul","Azul","Azul-Rojo","Rojo","Rojo-Negro","Negro 1er Dan","Negro 2do Dan","Negro 3er Dan","Negro 4to Dan","Negro 5to Dan","Negro 6to Dan","Negro 7mo Dan","Negro 8vo Dan"];
const CIN_BG={"Blanco":"#e8e8e8","Blanco-Amarillo":"#f0d060","Amarillo":"#f4c430","Amarillo-Verde":"#a8c830","Verde":"#22c55e","Verde-Azul":"#1a9e7a","Azul":"#3b82f6","Azul-Rojo":"#7040c0","Rojo":"#e63946","Rojo-Negro":"#8b1a1a","Negro 1er Dan":"#1a1a1a","Negro 2do Dan":"#1a1a1a","Negro 3er Dan":"#1a1a1a","Negro 4to Dan":"#1a1a1a","Negro 5to Dan":"#1a1a1a","Negro 6to Dan":"#1a1a1a","Negro 7mo Dan":"#1a1a1a","Negro 8vo Dan":"#1a1a1a"};
const CIN_FG={"Blanco":"#333","Blanco-Amarillo":"#333","Amarillo":"#333","Amarillo-Verde":"#fff","Verde":"#fff","Verde-Azul":"#fff","Azul":"#fff","Azul-Rojo":"#fff","Rojo":"#fff","Rojo-Negro":"#fff","Negro 1er Dan":"#ffd700","Negro 2do Dan":"#ffd700","Negro 3er Dan":"#ffd700","Negro 4to Dan":"#ffd700","Negro 5to Dan":"#ffd700","Negro 6to Dan":"#ffd700","Negro 7mo Dan":"#ffd700","Negro 8vo Dan":"#ffd700"};
const MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DIAS_SEMANA=["Lun","Mar","Mie","Jue","Vie","Sab","Dom"];
const HOY=new Date().toISOString().slice(0,10);
const MES=new Date().getMonth();
const ANO=new Date().getFullYear();
// Asistencia: P=Presente A=Ausente T=Tardanza J=Justificado
const AEST_RAW=["P","A","T","J"];
const AEST_EMOJI=["&#x2705;","&#x274C;","&#x26A0;&#xFE0F;","&#x1FA7A;"];
const ALBL=["Presente","Ausente","Tardanza","Justificado"];
const ACOL=["#22c55e","#e63946","#f59e0b","#3b82f6"];

let tab="alumnos",grupo="ninos",asisFecha=HOY;
let pagoMes=MES,pagoAno=ANO,pagoGrupo="ninos",examGrupo="ninos",asisGrupo="ninos";
let sedes=[],sedeId="",logoDataUrl="",diasSel=[];
let DB={alumnos:[],asistencia:{},pagos:{},examenes:[]};
let db,fsLib;

function sync(on){var b=document.getElementById("sync-bar");if(on)b.classList.add("on");else b.classList.remove("on");}
function edad(nac){if(!nac)return"?";var d=new Date(nac),h=new Date();return h.getFullYear()-d.getFullYear()-(h<new Date(h.getFullYear(),d.getMonth(),d.getDate())?1:0);}
function tag(txt,color){return'<span class="tag" style="background:'+color+'20;color:'+color+';border:1px solid '+color+'40">'+txt+'</span>';}
function cinBadge(c,sz){
  sz=sz||42;var bg=CIN_BG[c]||"#333",fg=CIN_FG[c]||"#fff",label=c||"?";
  if(label.indexOf("-")>-1){var p=label.split("-");label=p[0].slice(0,3)+"/"+p[1].slice(0,3);}
  else if(label.indexOf(" ")>-1){var p=label.split(" ");label=p[0].slice(0,3)+(p[2]?"\n"+p[1]+" "+p[2]:p[1]?"\n"+p[1]:"");}
  else label=label.slice(0,3);
  return'<div class="cin" style="width:'+sz+'px;height:'+sz+'px;background:'+bg+';color:'+fg+'">'+label.toUpperCase()+'</div>';
}
function cinSel(id,val){return'<select id="'+id+'">'+CIN.map(function(c){return'<option'+(c===val?' selected':'')+'>'+c+'</option>';}).join('')+'</select>';}
function estadoCol(e){return e==="Activo"?"#22c55e":e==="Inactivo"?"#f59e0b":"#e63946";}
function limpiarTel(t){return(t||"").replace(/\D/g,"");}
function sedeActual(){return sedes.find(function(s){return s.id===sedeId;})||sedes[0]||{};}
function openModal(t,h){document.getElementById("modal-title").innerHTML=t;document.getElementById("modal-body").innerHTML=h;document.getElementById("modal").classList.remove("hidden");}
function closeModal(){document.getElementById("modal").classList.add("hidden");}
function updateHeader(){
  var s=sedeActual();
  document.getElementById("escuela-nombre").textContent=s.nombre||"TKD Academia";
  var act=DB.alumnos.filter(function(a){return a.estado==="Activo";}).length;
  document.getElementById("header-sub").textContent=DB.alumnos.length+" alumnos - "+act+" activos";
  var emoji=document.getElementById("logo-emoji"),img=document.getElementById("logo-img-el");
  if(s.logo){emoji.style.display="none";img.src=s.logo;img.style.display="block";}
  else{emoji.style.display="";img.style.display="none";}
}

// ── Firebase ──────────────────────────────────────────────────────────────────
async function fsSet(col,id,data){sync(true);await fsLib.setDoc(fsLib.doc(db,col,id),data);sync(false);}
async function fsGetAll(col){var snap=await fsLib.getDocs(fsLib.collection(db,col));var r=[];snap.forEach(function(d){r.push(Object.assign({id:d.id},d.data()));});return r;}
async function fsDel(col,id){await fsLib.deleteDoc(fsLib.doc(db,col,id));}
async function fsGetDoc(col,id){var d=await fsLib.getDoc(fsLib.doc(db,col,id));return d.exists()?d.data():null;}

function pref(){return"s_"+sedeId+"_";}
async function cargarTodo(){
  if(!sedeId)return;
  var p=pref();
  var res=await Promise.all([fsGetAll(p+"alumnos"),fsGetAll(p+"examenes"),fsGetDoc(p+"meta","asistencia"),fsGetDoc(p+"meta","pagos")]);
  DB.alumnos=res[0];DB.examenes=res[1];DB.asistencia=res[2]||{};DB.pagos=res[3]||{};
}
async function saveAsistencia(){await fsSet(pref()+"meta","asistencia",DB.asistencia);}
async function savePagos(){await fsSet(pref()+"meta","pagos",DB.pagos);}
async function saveAlumno(a){await fsSet(pref()+"alumnos",a.id,a);}
async function delAlumno(id){await fsDel(pref()+"alumnos",id);}
async function saveExamen(ex){await fsSet(pref()+"examenes",ex.id,ex);}
async function delExamen(id){await fsDel(pref()+"examenes",id);}
async function saveSedes(){await fsSet("config","sedes",{lista:sedes});}

// ── SEDES ─────────────────────────────────────────────────────────────────────
function renderSedeBar(){
  var bar=document.getElementById("sede-bar");
  bar.innerHTML='<button class="sede-add" onclick="modalNuevaSede()">+</button>';
  sedes.forEach(function(s){
    var chip=document.createElement("button");
    chip.className="sede-chip"+(s.id===sedeId?" active":"");
    chip.textContent=s.nombre;
    chip.onclick=async function(){sedeId=s.id;await cargarTodo();updateHeader();renderSedeBar();render();};
    var timer;
    chip.addEventListener("touchstart",function(){timer=setTimeout(function(){modalEditarSede(s.id);},700);});
    chip.addEventListener("touchend",function(){clearTimeout(timer);});
    bar.appendChild(chip);
  });
}
function diasHTML(sel){
  return'<div class="dias-check">'+DIAS_SEMANA.map(function(d){var on=(sel||[]).indexOf(d)>-1;return'<button type="button" class="dia-btn'+(on?" on":"")+'" onclick="toggleDia(\''+d+'\')" id="dia-'+d+'">'+d+'</button>';}).join('')+'</div>';
}
function toggleDia(d){
  var idx=diasSel.indexOf(d);if(idx>-1)diasSel.splice(idx,1);else diasSel.push(d);
  document.querySelectorAll(".dia-btn").forEach(function(b){var dia=b.id.replace("dia-","");b.className="dia-btn"+(diasSel.indexOf(dia)>-1?" on":"");});
}
function modalNuevaSede(){
  logoDataUrl="";diasSel=[];
  openModal("Nueva sede",
    '<div class="field"><label>Nombre *</label><input id="sd-nombre" placeholder="ej: Sede Norte"/></div>'+
    '<div class="field"><label>Dias de entrenamiento</label>'+diasHTML([])+'</div>'+
    '<div class="field"><label>Logo</label><label style="display:flex;align-items:center;gap:12px;cursor:pointer">'+
    '<div style="width:56px;height:56px;border-radius:12px;background:#222;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:28px" id="sd-prev">&#x1F94B;</div>'+
    '<span style="background:var(--card2);border-radius:10px;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);border:1.5px dashed var(--border)">&#x1F4F7; Elegir</span>'+
    '<input type="file" accept="image/*" style="display:none" onchange="prevLogo(this,\'sd-prev\')"/></label></div>'+
    '<div style="display:flex;gap:8px"><button class="btn btn-outline" style="width:50%" onclick="closeModal()">Cancelar</button>'+
    '<button class="btn btn-red" style="width:50%" onclick="crearSede()">Crear</button></div>');
}
function modalEditarSede(id){
  var s=sedes.find(function(x){return x.id===id;});if(!s)return;
  logoDataUrl="";diasSel=(s.dias||[]).slice();
  openModal("Editar sede",
    '<div class="field"><label>Nombre</label><input id="sd-nombre" value="'+s.nombre+'"/></div>'+
    '<div class="field"><label>Dias de entrenamiento</label>'+diasHTML(s.dias||[])+'</div>'+
    '<div class="field"><label>Logo</label><label style="display:flex;align-items:center;gap:12px;cursor:pointer">'+
    '<div style="width:56px;height:56px;border-radius:12px;background:#222;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:28px" id="sd-prev">'+
    (s.logo?'<img src="'+s.logo+'" style="width:100%;height:100%;object-fit:cover"/>':"&#x1F94B;")+
    '</div><span style="background:var(--card2);border-radius:10px;padding:10px 14px;font-weight:700;font-size:13px;color:var(--muted);border:1.5px dashed var(--border)">&#x1F4F7; Cambiar</span>'+
    '<input type="file" accept="image/*" style="display:none" onchange="prevLogo(this,\'sd-prev\')"/></label></div>'+
    '<div class="div"></div>'+
    '<div style="display:flex;gap:8px">'+
    '<button class="btn btn-outline-red" style="width:50%" onclick="eliminarSede(\''+id+'\')">&#x1F5D1; Eliminar</button>'+

    var prom=ex.notaTec&&ex.notaAct?((+ex.notaTec+(+ex.notaAct))/2).toFixed(1):"-";
    var col=ex.resultado==="Aprobado"?"#22c55e":ex.resultado==="Reprobado"?"#e63946":"#f59e0b";
    h+='<div class="card" style="border-color:'+col+'40;cursor:pointer" onclick="modalVerExamen(\''+ex.id+'\')">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">'+
      '<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+(a?a.nombre:"-")+'</div>'+
      '<div style="font-size:11px;color:var(--muted);margin-top:2px">'+ex.fecha+' - '+(ex.cinturonActual||"?")+' a '+(ex.cinturonObtener||"?")+'</div></div>'+
      '<div class="ebig" style="color:'+(+prom>=6?"#22c55e":+prom>0?"#e63946":"var(--muted)")+'">'+prom+'</div></div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap">'+tag(ex.resultado,col)+' '+tag(ex.pagado?"Pagado":"Pend.",ex.pagado?"#22c55e":"#e63946")+'</div></div>';
  });
  document.getElementById("content").innerHTML=h;
}
function formExamenHTML(ex){
  var al=DB.alumnos.filter(function(a){return a.grupo===examGrupo&&a.estado==="Activo";});
  var prom=ex&&ex.notaTec&&ex.notaAct?((+ex.notaTec+(+ex.notaAct))/2).toFixed(1):"-";
  return'<div class="field"><label>Alumno *</label><select id="ex-a"><option value="">Seleccionar...</option>'+
    al.map(function(a){return'<option value="'+a.id+'"'+(ex&&ex.alumnoId==a.id?" selected":"")+'>'+a.nombre+'</option>';}).join('')+'</select></div>'+
    '<div class="field"><label>Fecha</label><input type="date" id="ex-fecha" value="'+(ex&&ex.fecha||HOY)+'"/></div>'+
    '<div class="g2"><div class="field"><label>Cinturon actual</label>'+cinSel("ex-ca",ex&&ex.cinturonActual||"Blanco")+'</div>'+
    '<div class="field"><label>A obtener</label>'+cinSel("ex-co",ex&&ex.cinturonObtener||"Blanco-Amarillo")+'</div></div>'+
    '<div class="g2"><div class="field"><label>Nota tecnica (1-10)</label><input type="number" min="1" max="10" id="ex-tec" value="'+(ex&&ex.notaTec||"")+'" oninput="updProm()"/></div>'+
    '<div class="field"><label>Nota actitud (1-10)</label><input type="number" min="1" max="10" id="ex-act" value="'+(ex&&ex.notaAct||"")+'" oninput="updProm()"/></div></div>'+
    '<div class="card2" style="text-align:center;margin-bottom:12px">'+
    '<div style="font-size:10px;color:var(--muted);font-weight:700;margin-bottom:2px">PROMEDIO</div>'+
    '<div id="pd" style="font-size:44px;font-weight:800;line-height:1;color:'+(+prom>=6?"#22c55e":+prom>0?"#e63946":"var(--muted)")+'">'+prom+'</div></div>'+
    '<div class="field"><label>Resultado</label><select id="ex-res">'+
    ["Aprobado","Reprobado","En revision"].map(function(r){return'<option'+(ex&&ex.resultado===r?" selected":"")+'>'+r+'</option>';}).join('')+'</select></div>'+
    '<div class="g2"><div class="field"><label>Monto $</label><input type="number" id="ex-monto" value="'+(ex&&ex.montoPago||0)+'"/></div>'+
    '<div class="field"><label>Estado pago</label><select id="ex-pago">'+
    '<option value="si"'+(ex&&ex.pagado?" selected":"")+'>Pagado</option>'+
    '<option value="no"'+(!ex||!ex.pagado?" selected":"")+'>Pendiente</option></select></div></div>'+
    '<div class="field"><label>Observaciones</label><textarea id="ex-obs" rows="2" style="resize:none">'+(ex&&ex.obs||"")+'</textarea></div>'+
    '<div style="display:flex;gap:8px;margin-top:4px">'+
    '<button class="btn btn-outline" style="width:50%" onclick="closeModal()">Cancelar</button>'+
    '<button class="btn btn-red" style="width:50%" onclick="guardarExamen(\''+(ex&&ex.id||"")+'\')">Guardar</button></div>';
}
function updProm(){
  var t=+(document.getElementById("ex-tec")||{}).value,a=+(document.getElementById("ex-act")||{}).value;
  var el=document.getElementById("pd");if(!el)return;
  if(t&&a){var p=((t+a)/2).toFixed(1);el.textContent=p;el.style.color=p>=6?"#22c55e":"#e63946";}
  else{el.textContent="-";el.style.color="var(--muted)";}
}
function modalNuevoExamen(){openModal("Nuevo examen",formExamenHTML(null));}
function modalVerExamen(id){
  var ex=DB.examenes.find(function(e){return e.id===id;});if(!ex)return;
  var a=DB.alumnos.find(function(x){return x.id==ex.alumnoId;});
  var prom=ex.notaTec&&ex.notaAct?((+ex.notaTec+(+ex.notaAct))/2).toFixed(1):"-";
  var col=ex.resultado==="Aprobado"?"#22c55e":ex.resultado==="Reprobado"?"#e63946":"#f59e0b";
  openModal("Examen",
    '<div class="card2" style="margin-bottom:14px"><div style="font-weight:800;font-size:16px;margin-bottom:3px">'+(a?a.nombre:"-")+'</div>'+
    '<div style="font-size:12px;color:var(--muted)">'+ex.fecha+'</div>'+
    '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">'+tag((ex.cinturonActual||"?")+" a "+(ex.cinturonObtener||"?"),"#888")+" "+tag(ex.resultado,col)+'</div></div>'+
    [["Nota tecnica",ex.notaTec||"-"],["Nota actitud",ex.notaAct||"-"],["Promedio",prom],["Monto","$"+(ex.montoPago||0).toLocaleString()],["Pago",ex.pagado?"Pagado":"Pendiente"],["Obs.",ex.obs||"-"]].map(function(x){
      return'<div style="display:flex;gap:10px;margin-bottom:9px;font-size:13px"><span style="color:var(--muted);min-width:100px;flex-shrink:0">'+x[0]+'</span><span style="font-weight:600">'+x[1]+'</span></div>';
    }).join('')+
    '<div class="div"></div><div style="display:flex;gap:8px">'+
    '<button class="btn btn-outline-red" style="width:50%" onclick="openModal(\'Editar examen\',formExamenHTML(DB.examenes.find(function(e){return e.id===\''+id+'\';})))">&#x270F; Editar</button>'+
    '<button class="btn btn-outline-red" style="width:50%" onclick="eliminarExamen(\''+id+'\')">&#x1F5D1; Eliminar</button></div>');
}
async function guardarExamen(id){
  var g=function(k){var el=document.getElementById(k);return el?el.value:"";};
  var aid=g("ex-a");if(!aid){alert("Selecciona un alumno");return;}
  var obj={alumnoId:aid,fecha:g("ex-fecha"),cinturonActual:g("ex-ca"),cinturonObtener:g("ex-co"),notaTec:g("ex-tec"),notaAct:g("ex-act"),resultado:g("ex-res"),montoPago:+(g("ex-monto"))||0,pagado:g("ex-pago")==="si",obs:g("ex-obs")};
  if(id){obj.id=id;DB.examenes=DB.examenes.map(function(e){return e.id===id?Object.assign({},e,obj):e;});}
  else{obj.id="ex"+Date.now();DB.examenes.push(obj);}
  await saveExamen(obj);closeModal();renderExamenes();
}
async function eliminarExamen(id){
  if(!confirm("Eliminar este examen?"))return;
  DB.examenes=DB.examenes.filter(function(e){return e.id!==id;});
  await delExamen(id);closeModal();renderExamenes();
}

// ── EXCEL ─────────────────────────────────────────────────────────────────────
function exportarExcel(){
  var wb=XLSX.utils.book_new();var sede=sedeActual();
  var ah=[["#","Sede","Grupo","Nombre","Fecha Nac","Edad","Ingreso","Cinturon","Estado","Cuota","Telefono","Apoderado","Tel Apoderado","Email","Observaciones"]];
  DB.alumnos.forEach(function(a,i){ah.push([i+1,sede.nombre,a.grupo==="ninos"?"Ninos":"Jovenes",a.nombre,a.nac,edad(a.nac),a.ingreso,a.cinturon,a.estado,a.cuota||0,a.tel,a.apodNombre||"",a.apodTel||"",a.email,a.obs]);});
  var ws1=XLSX.utils.aoa_to_sheet(ah);ws1["!cols"]=[5,16,12,28,14,7,14,20,12,12,16,22,16,28,28].map(function(w){return{wch:w};});
  XLSX.utils.book_append_sheet(wb,ws1,"Alumnos");
  var claves=Object.keys(DB.pagos).sort();
  var ph=[["#","Grupo","Nombre","Cuota"].concat(claves.map(function(k){var p=k.split("-");return MESES[+p[1]]+" "+p[0];})).concat(["Total $"])];
  DB.alumnos.filter(function(a){return a.estado==="Activo";}).forEach(function(a,i){
    var fila=[i+1,a.grupo==="ninos"?"Ninos":"Jovenes",a.nombre,a.cuota||0];var tp=0;
    claves.forEach(function(k){var est=(DB.pagos[k]||{})[a.id]||"N";var l=est==="OK"?"Pagado":est==="P"?"Parcial":"Pendiente";fila.push(l);if(est==="OK")tp+=a.cuota||0;if(est==="P")tp+=Math.round((a.cuota||0)/2);});
    fila.push(tp);ph.push(fila);
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ph),"Pagos");
  var fechas=Object.keys(DB.asistencia).sort();
  var ash=[["#","Grupo","Nombre"].concat(fechas).concat(["Total","Porcentaje"])];
  DB.alumnos.filter(function(a){return a.estado==="Activo";}).forEach(function(a,i){
    var fila=[i+1,a.grupo==="ninos"?"Ninos":"Jovenes",a.nombre];var pres=0;
    fechas.forEach(function(f){var est=(DB.asistencia[f]||{})[a.id]||"A";var l=est==="P"?"Presente":est==="T"?"Tardanza":est==="J"?"Justificado":"Ausente";fila.push(l);if(est==="P")pres++;});
    fila.push(pres,fechas.length>0?Math.round(pres/fechas.length*100)+"%":"0%");ash.push(fila);
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ash.length>1?ash:[ash[0],["Sin registros"]]),"Asistencia");
  var eh=[["#","Grupo","Alumno","Cinturon actual","A obtener","Fecha","Nota Tecnica","Nota Actitud","Promedio","Resultado","Monto","Pago","Observaciones"]];
  DB.examenes.forEach(function(ex,i){var a=DB.alumnos.find(function(x){return x.id==ex.alumnoId;});var prom=ex.notaTec&&ex.notaAct?((+ex.notaTec+(+ex.notaAct))/2).toFixed(1):"-";eh.push([i+1,a?(a.grupo==="ninos"?"Ninos":"Jovenes"):"",a?a.nombre:"",ex.cinturonActual,ex.cinturonObtener,ex.fecha,ex.notaTec||"-",ex.notaAct||"-",prom,ex.resultado,ex.montoPago||0,ex.pagado?"Pagado":"Pendiente",ex.obs]);});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(eh.length>1?eh:[eh[0],["Sin examenes"]]),"Examenes");
  var fecha=new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb,(sede.nombre||"TKD").replace(/\s+/g,"_")+"_"+fecha+".xlsx");
}

// ── TABS / RENDER ─────────────────────────────────────────────────────────────
function goTab(t){
  tab=t;document.querySelectorAll(".tab-btn").forEach(function(b){b.classList.remove("active");});
  document.getElementById("tab-"+t).classList.add("active");render();
}
function render(){
  if(tab==="alumnos")renderAlumnos();
  else if(tab==="asistencia")renderAsistencia();
  else if(tab==="pagos")renderPagos();
  else if(tab==="examenes")renderExamenes();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init(){
  db=window.db;fsLib=window.fsLib;
  try{
    var sedesDoc=await fsLib.getDoc(fsLib.doc(db,"config","sedes"));
    if(sedesDoc.exists()&&sedesDoc.data().lista&&sedesDoc.data().lista.length>0){
      sedes=sedesDoc.data().lista;
    } else {
      sedes=[{id:"s1",nombre:"Sede Principal",logo:"",dias:[]}];
      await saveSedes();
    }
  } catch(e){sedes=[{id:"s1",nombre:"Sede Principal",logo:"",dias:[]}];}
  sedeId=sedes[0].id;
  await cargarTodo();
  document.getElementById("loading-screen").style.display="none";
  updateHeader();renderSedeBar();render();
}
window.addEventListener("firebase-ready",function(){init();});
if(window.firebaseReady){init();}
</script>
