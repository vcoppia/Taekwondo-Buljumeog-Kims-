<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="TKD Academia"/>
<meta name="theme-color" content="#0a0a0a"/>
<title>TKD Academia</title>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    const sw=`const CACHE='tkd-v2';self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['./',' ./index.html']))));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>caches.match('./index.html')))));`;
    const blob=new Blob([sw],{type:'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
  });
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#f0f0f0;min-height:100vh;overscroll-behavior:none}
:root{--red:#e63946;--gold:#f4c430;--dark:#0a0a0a;--card:#181818;--card2:#222;--border:#2a2a2a;--muted:#777;--green:#22c55e;--blue:#3b82f6;--r:14px}
input,select,textarea{font-family:inherit;font-size:15px;background:#111;color:#f0f0f0;border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;width:100%;outline:none;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--red)}
select option{background:#111}
button{cursor:pointer;font-family:inherit;border:none;outline:none}
.hidden{display:none!important}
#bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.tab-btn{padding:10px 0 14px;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;border-top:2px solid transparent;font-size:10px;font-weight:600}
.tab-btn.active{color:var(--red);border-top-color:var(--red)}
#header{background:#111;position:sticky;top:0;z-index:40;border-bottom:1px solid var(--border);padding:10px 14px}
.header-inner{display:flex;align-items:center;gap:9px}
.logo-img{width:40px;height:40px;border-radius:10px;background:#222;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden;cursor:pointer}
.logo-img img{width:100%;height:100%;object-fit:cover}
#content{padding:14px 14px 88px}
.card{background:var(--card);border-radius:var(--r);padding:14px 15px;border:1px solid var(--border);margin-bottom:10px}
.card2{background:var(--card2);border-radius:12px;padding:12px 14px}
.stats-row{display:grid;gap:9px;margin-bottom:14px}
.stat-box{background:var(--card);border-radius:12px;padding:13px 10px;border:1px solid var(--border);text-align:center}
.stat-n{font-size:28px;font-weight:800;line-height:1}
.stat-l{font-size:10px;color:var(--muted);margin-top:3px;font-weight:600}
.tag{display:inline-flex;align-items:center;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;white-space:nowrap}
.btn{border-radius:12px;padding:13px 18px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-bottom:8px;border:none}
.btn-red{background:var(--red);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-outline{background:transparent;color:var(--muted);border:1.5px solid var(--border)}
.btn-outline-red{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.overlay{position:fixed;inset:0;background:#000c;z-index:100;display:flex;align-items:flex-end}
.modal{background:var(--card);width:100%;max-height:93vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 16px 44px;-webkit-overflow-scrolling:touch}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.mt{font-size:21px;font-weight:800}
.mc{background:#2a2a2a;border-radius:50%;width:30px;height:30px;color:#aaa;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.item{background:var(--card);border-radius:var(--r);padding:13px 14px;border:1px solid var(--border);margin-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:12px}
.cin{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;text-align:center;line-height:1.2;flex-shrink:0}
.gtabs{display:flex;gap:8px;margin-bottom:14px}
.gtab{flex:1;padding:10px;border-radius:11px;font-weight:700;font-size:13px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);text-align:center}
.gtab.active{background:var(--red);color:#fff;border-color:var(--red)}
.srow{display:flex;gap:8px;margin-bottom:12px}
.srow input{flex:1}
.addbtn{background:var(--red);border-radius:11px;padding:0 15px;color:#fff;font-weight:700;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:4px}
.popts{display:flex;gap:5px;margin-top:9px}
.popt{flex:1;padding:8px 3px;border-radius:9px;font-size:10px;font-weight:700;border:1.5px solid var(--border);background:var(--card2);color:var(--muted);text-align:center;line-height:1.4}
.pg{background:#22c55e18;color:var(--green);border-color:var(--green)}
.po{background:#f59e0b18;color:#f59e0b;border-color:#f59e0b}
.pr{background:#e6394618;color:var(--red);border-color:var(--red)}
.ebig{font-size:40px;font-weight:800;line-height:1}
.div{height:1px;background:var(--border);margin:14px 0}
/* SEDE selector */
#sede-bar{background:#0f0f0f;border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#sede-bar::-webkit-scrollbar{display:none}
.sede-chip{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;border:1.5px solid var(--border);background:var(--card);color:var(--muted);white-space:nowrap;flex-shrink:0}
.sede-chip.active{background:var(--red);color:#fff;border-color:var(--red)}
.sede-add{width:32px;height:32px;border-radius:50%;background:var(--card2);border:1.5px dashed var(--border);color:var(--muted);font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</head>
<body>

<div id="header">
  <div class="header-inner">
    <div class="logo-img" id="logo-box" onclick="abrirConfig()">
      <span id="logo-emoji">🥋</span>
      <img id="logo-img-el" style="display:none"/>
    </div>
    <div style="flex:1;min-width:0">
      <div style="font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="escuela-nombre">Mi Academia TKD</div>
      <div style="font-size:11px;color:var(--muted)" id="header-sub">cargando...</div>
    </div>
    <button onclick="exportarExcel()" style="background:#22c55e;border-radius:10px;padding:8px 11px;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px;flex-shrink:0">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Excel
    </button>
  </div>
</div>

<!-- BARRA DE SEDES -->
<div id="sede-bar">
  <button class="sede-add" onclick="modalNuevaSede()" title="Nueva sede">+</button>
</div>

<div id="content"></div>

<nav id="bottom-nav">
  <button class="tab-btn active" onclick="goTab('alumnos')" id="tab-alumnos">
    <svg width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    Alumnos
  </button>
  <button class="tab-btn" onclick="goTab('asistencia')" id="tab-asistencia">
    <svg width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 6H3v14h14v-5"/><polyline points="9 11 12 14 22 4"/></svg>
    Asistencia
  </button>
  <button class="tab-btn" onclick="goTab('pagos')" id="tab-pagos">
    <svg width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
    Pagos
  </button>
  <button class="tab-btn" onclick="goTab('examenes')" id="tab-examenes">
    <svg width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="8 21 12 17 16 21"/><line x1="12" y1="17" x2="12" y2="11"/><path d="M7 4h10l-1 7H8L7 4z"/><path d="M7 4H4v3a3 3 0 0 0 3 3"/><path d="M17 4h3v3a3 3 0 0 1-3 3"/></svg>
    Exámenes
  </button>
</nav>

<div class="overlay hidden" id="modal" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="mh">
      <div class="mt" id="modal-title"></div>
      <button class="mc" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const CIN    = ["Blanco","Blanco-Amarillo","Amarillo","Amarillo-Verde","Verde","Verde-Azul","Azul","Azul-Rojo","Rojo","Rojo-Negro","Negro 1er Dan","Negro 2do Dan","Negro 3er Dan","Negro 4to Dan","Negro 5to Dan","Negro 6to Dan","Negro 7mo Dan","Negro 8vo Dan"];
const CIN_BG = {"Blanco":"#e8e8e8","Blanco-Amarillo":"#f0d060","Amarillo":"#f4c430","Amarillo-Verde":"#a8c830","Verde":"#22c55e","Verde-Azul":"#1a9e7a","Azul":"#3b82f6","Azul-Rojo":"#6040c0","Rojo":"#e63946","Rojo-Negro":"#8b1a1a","Negro 1er Dan":"#1a1a1a","Negro 2do Dan":"#1a1a1a","Negro 3er Dan":"#1a1a1a","Negro 4to Dan":"#1a1a1a","Negro 5to Dan":"#1a1a1a","Negro 6to Dan":"#1a1a1a","Negro 7mo Dan":"#1a1a1a","Negro 8vo Dan":"#1a1a1a"};
const CIN_FG = {"Blanco":"#333","Blanco-Amarillo":"#333","Amarillo":"#333","Amarillo-Verde":"#fff","Verde":"#fff","Verde-Azul":"#fff","Azul":"#fff","Azul-Rojo":"#fff","Rojo":"#fff","Rojo-Negro":"#fff","Negro 1er Dan":"#fff","Negro 2do Dan":"#fff","Negro 3er Dan":"#fff","Negro 4to Dan":"#fff","Negro 5to Dan":"#fff","Negro 6to Dan":"#fff","Negro 7mo Dan":"#fff","Negro 8vo Dan":"#fff"};
const MESES  = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const HOY    = new Date().toISOString().slice(0,10);
const MES    = new Date().getMonth();
const ANO    = new Date().getFullYear();

function lsGet(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

// ── SEDES ─────────────────────────────────────────────────────────────────────
let sedes    = lsGet("tkd_sedes", [{id:"s1", nombre:"Sede Principal", logo:""}]);
let sedeId   = lsGet("tkd_sedeActual", "s1");

function sedeKey(k){ return `tkd_${sedeId}_${k}`; }
function svSede(k,v){ lsSet(sedeKey(k),v); }
function getSede(k,fb){ return lsGet(sedeKey(k),fb); }

function sedeActual(){ return sedes.find(s=>s.id===sedeId)||sedes[0]; }

// ── DB (por sede) ─────────────────────────────────────────────────────────────
let DB = {};
function cargarDB(){
  DB = {
    alumnos:    getSede("alumnos",[]),
    asistencia: getSede("asistencia",{}),
    pagos:      getSede("pagos",{}),
    examenes:   getSede("examenes",[]),
  };
}
function sv(k){ svSede(k, DB[k]); }

// ── Estado UI ─────────────────────────────────────────────────────────────────
let tab       = "alumnos";
let grupo     = "ninos";
let asisFecha = HOY;
let pagoMes   = MES, pagoAno = ANO;
let pagoGrupo = "ninos";
let examGrupo = "ninos";
let logoDataUrl = "";

// ── Utils ─────────────────────────────────────────────────────────────────────
function edad(nac){if(!nac)return"?";const d=new Date(nac),h=new Date();return h.getFullYear()-d.getFullYear()-(h<new Date(h.getFullYear(),d.getMonth(),d.getDate())?1:0);}
function tag(txt,color){return `<span class="tag" style="background:${color}20;color:${color};border:1px solid ${color}40">${txt}</span>`;}
function cinBadge(c,sz=42){return `<div class="cin" style="width:${sz}px;height:${sz}px;background:${CIN_BG[c]||'#333'};color:${CIN_FG[c]||'#fff'}">${(c||"?").slice(0,3).toUpperCase()}</div>`;}
function cinSel(id,val){return `<select id="${id}">${CIN.map(c=>`<option${c===val?" selected":""}>${c}</option>`).join("")}</select>`;}
function estadoCol(e){return e==="Activo"?"#22c55e":e==="Inactivo"?"#f59e0b":"#e63946";}
function grupoLabel(g){return g==="ninos"?"👦 Niños":"🧑 Jóvenes";}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openModal(title,html){document.getElementById("modal-title").textContent=title;document.getElementById("modal-body").innerHTML=html;document.getElementById("modal").classList.remove("hidden");}
function closeModal(){document.getElementById("modal").classList.add("hidden");}

// ══════════════════════════════════════════════════════════════════════════════
// SEDES
// ══════════════════════════════════════════════════════════════════════════════
function renderSedeBar(){
  const bar = document.getElementById("sede-bar");
  bar.innerHTML = `<button class="sede-add" onclick="modalNuevaSede()" title="Nueva sede">+</button>`;
  sedes.forEach(s=>{
    const chip = document.createElement("button");
    chip.className = "sede-chip" + (s.id===sedeId?" active":"");
    chip.textContent = s.nombre;
    chip.onclick = ()=>{ sedeId=s.id; lsSet("tkd_sedeActual",sedeId); cargarDB(); updateHeader(); renderSedeBar(); render(); };
    chip.onlongpress = ()=> modalEditarSede(s.id);
    // long press para editar
    let timer;
    chip.addEventListener("touchstart",()=>{ timer=setTimeout(()=>modalEditarSede(s.id),700); });
    chip.addEventListener("touchend",()=>clearTimeout(timer));
    bar.appendChild(chip);
  });
}

function modalNuevaSede(){
  logoDataUrl="";
  openModal("Nueva sede",`
    <div class="field"><label>Nombre de la sede *</label>
      <input id="sd-nombre" placeholder="ej: Sede Norte"/>
    </div>
    <div class="field"><label>Logo (opcional)</label>
      <label style="display:flex;align-items:center;gap:12px;cursor:pointer">
        <div style="width:56px;height:56px;border-radius:12px;background:#222;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0" id="sd-prev">🥋</div>
        <div style="background:var(--card2);border-radius:10px;padding:10px 16px;font-weight:700;font-size:13px;color:var(--muted);border:1.5px dashed var(--border)">📷 Elegir imagen</div>
        <input type="file" accept="image/*" style="display:none" onchange="prevLogoSede(this,'sd-prev')"/>
      </label>
    </div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn btn-outline" style="width:50%" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-red" style="width:50%" onclick="guardarNuevaSede()">Crear sede</button>
    </div>`);
}

function modalEditarSede(id){
  const s=sedes.find(x=>x.id===id); if(!s) return;
  logoDataUrl="";
  openModal("Editar sede",`
    <div class="field"><label>Nombre de la sede</label>
      <input id="sd-nombre" value="${s.nombre}"/>
    </div>
    <div class="field"><label>Logo</label>
      <label style="display:flex;align-items:center;gap:12px;cursor:pointer">
        <div style="width:56px;height:56px;border-radius:12px;background:#222;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0" id="sd-prev">
          ${s.logo?`<img src="${s.logo}" style="width:100%;height:100%;object-fit:cover"/>`:"🥋"}
        </div>
        <div style="background:var(--card2);border-radius:10px;padding:10px 16px;font-weight:700;font-size:13px;color:var(--muted);border:1.5px dashed var(--border)">📷 Cambiar logo</div>
        <input type="file" accept="image/*" style="display:none" onchange="prevLogoSede(this,'sd-prev')"/>
      </label>
    </div>
    <div class="div"></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline-red" style="width:50%" onclick="eliminarSede('${id}')">🗑 Eliminar</button>
      <button class="btn btn-red" style="width:50%" onclick="guardarEditSede('${id}')">Guardar</button>
    </div>`);
}

function prevLogoSede(input,prevId){
  const file=input.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=e=>{
    logoDataUrl=e.target.result;
    document.getElementById(prevId).innerHTML=`<img src="${logoDataUrl}" style="width:100%;height:100%;object-fit:cover"/>`;
  };
  r.readAsDataURL(file);
}

function guardarNuevaSede(){
  const nombre=(document.getElementById("sd-nombre")?.value||"").trim();
  if(!nombre){alert("Ingresá el nombre de la sede");return;}
  const nueva={id:"s"+Date.now(), nombre, logo:logoDataUrl||""};
  sedes.push(nueva);
  lsSet("tkd_sedes",sedes);
  sedeId=nueva.id; lsSet("tkd_sedeActual",sedeId);
  cargarDB(); closeModal(); updateHeader(); renderSedeBar(); render();
}

function guardarEditSede(id){
  const nombre=(document.getElementById("sd-nombre")?.value||"").trim();
  if(!nombre){alert("Ingresá el nombre");return;}
  sedes=sedes.map(s=>s.id===id?{...s,nombre,logo:logoDataUrl||s.logo}:s);
  lsSet("tkd_sedes",sedes);
  closeModal(); updateHeader(); renderSedeBar();
}

function eliminarSede(id){
  if(sedes.length<=1){alert("Debe haber al menos una sede");return;}
  if(!confirm("¿Eliminar esta sede y todos sus datos?")) return;
  // Limpiar datos de la sede
  ["alumnos","asistencia","pagos","examenes"].forEach(k=>lsSet(`tkd_${id}_${k}`,null));
  sedes=sedes.filter(s=>s.id!==id);
  lsSet("tkd_sedes",sedes);
  sedeId=sedes[0].id; lsSet("tkd_sedeActual",sedeId);
  cargarDB(); closeModal(); updateHeader(); renderSedeBar(); render();
}

// ── Header / Config ───────────────────────────────────────────────────────────
function updateHeader(){
  const s=sedeActual();
  document.getElementById("escuela-nombre").textContent=s.nombre;
  const act=DB.alumnos.filter(a=>a.estado==="Activo").length;
  document.getElementById("header-sub").textContent=`${DB.alumnos.length} alumnos · ${act} activos`;
  const emoji=document.getElementById("logo-emoji");
  const img=document.getElementById("logo-img-el");
  if(s.logo){emoji.style.display="none";img.src=s.logo;img.style.display="block";}
  else{emoji.style.display="";img.style.display="none";}
}

function abrirConfig(){ modalEditarSede(sedeId); }

// ══════════════════════════════════════════════════════════════════════════════
// ALUMNOS
// ══════════════════════════════════════════════════════════════════════════════
function renderAlumnos(search=""){
  const filtrados=DB.alumnos.filter(a=>a.grupo===grupo&&(a.nombre.toLowerCase().includes(search.toLowerCase())||(a.cinturon||"").toLowerCase().includes(search.toLowerCase())));
  const ninos=DB.alumnos.filter(a=>a.grupo==="ninos"&&a.estado==="Activo").length;
  const jovenes=DB.alumnos.filter(a=>a.grupo==="jovenes"&&a.estado==="Activo").length;
  let h=`
    <div class="stats-row" style="grid-template-columns:1fr 1fr 1fr">
      <div class="stat-box"><div class="stat-n">${DB.alumnos.length}</div><div class="stat-l">Total</div></div>
      <div class="stat-box"><div class="stat-n" style="color:#f59e0b">${ninos}</div><div class="stat-l">👦 Niños</div></div>
      <div class="stat-box"><div class="stat-n" style="color:var(--blue)">${jovenes}</div><div class="stat-l">🧑 Jóvenes</div></div>
    </div>
    <div class="gtabs">
      <button class="gtab${grupo==="ninos"?" active":""}" onclick="grupo='ninos';renderAlumnos()">👦 Niños</button>
      <button class="gtab${grupo==="jovenes"?" active":""}" onclick="grupo='jovenes';renderAlumnos()">🧑 Jóvenes</button>
    </div>
    <div class="srow">
      <input type="search" placeholder="🔍 Buscar..." oninput="renderAlumnos(this.value)" value="${search}"/>
      <button class="addbtn" onclick="modalNuevoAlumno()">+ Nuevo</button>
    </div>`;
  if(filtrados.length===0){
    h+=`<div style="text-align:center;color:var(--muted);padding:40px 0">Sin alumnos en este grupo<br><br>
      <button class="btn btn-red" style="width:auto;padding:10px 24px" onclick="modalNuevoAlumno()">+ Agregar primero</button></div>`;
  } else {
    filtrados.forEach(a=>{
      h+=`<div class="item" onclick="modalVerAlumno(${a.id})">
        ${cinBadge(a.cinturon)}

// ASISTENCIA
// ══════════════════════════════════════════════════════════════════════════════
const AEST=["✅","❌","⚠️","🏥"];
const ALBL=["Presente","Ausente","Tardanza","Justificado"];
const ACOL=["#22c55e","#e63946","#f59e0b","#3b82f6"];
let asisGrupo="ninos";

function renderAsistencia(){
  const reg=DB.asistencia[asisFecha]||{};
  const activos=DB.alumnos.filter(a=>a.grupo===asisGrupo&&a.estado==="Activo");
  const counts=AEST.map(e=>activos.filter(a=>reg[a.id]===e).length);
  let h=`
    <div class="gtabs">
      <button class="gtab${asisGrupo==="ninos"?" active":""}" onclick="asisGrupo='ninos';renderAsistencia()">👦 Niños</button>
      <button class="gtab${asisGrupo==="jovenes"?" active":""}" onclick="asisGrupo='jovenes';renderAsistencia()">🧑 Jóvenes</button>
    </div>
    <div class="field"><label>Fecha de la clase</label>
      <input type="date" value="${asisFecha}" onchange="asisFecha=this.value;renderAsistencia()"/>
    </div>
    <div class="stats-row" style="grid-template-columns:repeat(4,1fr);margin-bottom:14px">
      ${AEST.map((e,i)=>`<div class="stat-box"><div style="font-size:18px">${e}</div><div style="font-size:18px;font-weight:800;color:${ACOL[i]}">${counts[i]}</div><div style="font-size:9px;color:${ACOL[i]};font-weight:700">${ALBL[i]}</div></div>`).join("")}
    </div>
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <span style="color:var(--muted);font-size:12px">Toca el ícono para cambiar</span>
      <span style="font-weight:800;color:var(--green)">${counts[0]}/${activos.length}</span>
    </div>`;
  if(activos.length===0) h+=`<div style="text-align:center;color:var(--muted);padding:30px">Sin alumnos activos en este grupo</div>`;
  activos.forEach(a=>{
    const est=reg[a.id]||"❌";
    const idx=AEST.indexOf(est);
    const col=ACOL[idx]||"#e63946";
    h+=`<div class="item" style="border-color:${col}40">
      ${cinBadge(a.cinturon)}
      <div style="flex:1"><div style="font-weight:700;font-size:14px">${a.nombre}</div>
        <div style="font-size:11px;color:${col};font-weight:700;margin-top:2px">${ALBL[idx]}</div></div>
      <button onclick="toggleAsis(${a.id})" style="font-size:26px;background:none;border:2px solid ${col};border-radius:11px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;flex-shrink:0">${est}</button>
    </div>`;
  });
  document.getElementById("content").innerHTML=h;
}

function toggleAsis(id){
  const reg=DB.asistencia[asisFecha]||{};
  const curr=AEST.indexOf(reg[id]||"❌");
  reg[id]=AEST[(curr+1)%AEST.length];
  DB.asistencia[asisFecha]=reg; sv("asistencia"); renderAsistencia();
}

// PAGOS
// ══════════════════════════════════════════════════════════════════════════════
function renderPagos(){
  const key=`${pagoAno}-${pagoMes}`;
  const reg=DB.pagos[key]||{};
  const activos=DB.alumnos.filter(a=>a.grupo===pagoGrupo&&a.estado==="Activo");
  const pagados=activos.filter(a=>reg[a.id]==="✅ Pagado").length;
  const parciales=activos.filter(a=>reg[a.id]==="🔄 Parcial").length;
  const pendientes=activos.filter(a=>!reg[a.id]||reg[a.id]==="❌ Pendiente").length;
  const recaudado=activos.reduce((s,a)=>{if(reg[a.id]==="✅ Pagado")return s+(a.cuota||0);if(reg[a.id]==="🔄 Parcial")return s+Math.round((a.cuota||0)/2);return s;},0);
  const deuda=activos.reduce((s,a)=>(!reg[a.id]||reg[a.id]==="❌ Pendiente")?s+(a.cuota||0):s,0);
  let h=`
    <div class="gtabs">
      <button class="gtab${pagoGrupo==="ninos"?" active":""}" onclick="pagoGrupo='ninos';renderPagos()">👦 Niños</button>
      <button class="gtab${pagoGrupo==="jovenes"?" active":""}" onclick="pagoGrupo='jovenes';renderPagos()">🧑 Jóvenes</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <select style="flex:1" onchange="pagoMes=+this.value;renderPagos()">${MESES.map((m,i)=>`<option value="${i}"${i===pagoMes?" selected":""}>${m}</option>`).join("")}</select>
      <select style="width:86px" onchange="pagoAno=+this.value;renderPagos()">${[2024,2025,2026,2027].map(y=>`<option${y===pagoAno?" selected":""}>${y}</option>`).join("")}</select>
    </div>
    <div class="card" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between">
        <div><div style="font-size:10px;color:var(--muted);font-weight:700">RECAUDADO</div>
          <div style="font-size:26px;font-weight:800;color:var(--green)">$${recaudado.toLocaleString()}</div></div>
        <div style="text-align:right"><div style="font-size:10px;color:var(--muted);font-weight:700">DEUDA</div>
          <div style="font-size:26px;font-weight:800;color:var(--red)">$${deuda.toLocaleString()}</div></div>
      </div>
    </div>
    <div class="stats-row" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:14px">
      <div class="stat-box"><div class="stat-n" style="color:var(--green)">${pagados}</div><div class="stat-l">✅ Pagados</div></div>
      <div class="stat-box"><div class="stat-n" style="color:#f59e0b">${parciales}</div><div class="stat-l">🔄 Parcial</div></div>
      <div class="stat-box"><div class="stat-n" style="color:var(--red)">${pendientes}</div><div class="stat-l">❌ Pendiente</div></div>
    </div>`;
  if(activos.length===0) h+=`<div style="text-align:center;color:var(--muted);padding:30px">Sin alumnos activos en este grupo</div>`;
  activos.forEach(a=>{
    const est=reg[a.id]||"❌ Pendiente";
    h+=`<div class="card">
      <div style="display:flex;align-items:center;gap:11px">
        ${cinBadge(a.cinturon,38)}
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${a.nombre}</div>
          <div style="font-size:11px;color:var(--muted)">Cuota: $${(a.cuota||0).toLocaleString()}</div>
        </div>
      </div>
      <div class="popts">
        <button class="popt${est==="✅ Pagado"?" pg":""}" onclick="setPago(${a.id},'✅ Pagado')">✅<br/>Pagado</button>
        <button class="popt${est==="🔄 Parcial"?" po":""}" onclick="setPago(${a.id},'🔄 Parcial')">🔄<br/>Parcial</button>
        <button class="popt${est==="❌ Pendiente"?" pr":""}" onclick="setPago(${a.id},'❌ Pendiente')">❌<br/>Pendiente</button>
      </div>
    </div>`;
  });
  document.getElementById("content").innerHTML=h;
}

function setPago(id,est){
  const key=`${pagoAno}-${pagoMes}`;
  if(!DB.pagos[key]) DB.pagos[key]={};
  DB.pagos[key][id]=est; sv("pagos"); renderPagos();
}

// EXÁMENES
// ══════════════════════════════════════════════════════════════════════════════
function renderExamenes(){
  const exams=DB.examenes.filter(e=>{const a=DB.alumnos.find(x=>x.id==e.alumnoId);return a&&a.grupo===examGrupo;});
  const aprob=exams.filter(e=>e.resultado==="✅ Aprobado").length;
  const pendP=exams.filter(e=>!e.pagado).length;
  let h=`
    <div class="gtabs">
      <button class="gtab${examGrupo==="ninos"?" active":""}" onclick="examGrupo='ninos';renderExamenes()">👦 Niños</button>
      <button class="gtab${examGrupo==="jovenes"?" active":""}" onclick="examGrupo='jovenes';renderExamenes()">🧑 Jóvenes</button>
    </div>
    <div class="stats-row" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:12px">
      <div class="stat-box"><div class="stat-n">${exams.length}</div><div class="stat-l">Total</div></div>
      <div class="stat-box"><div class="stat-n" style="color:var(--green)">${aprob}</div><div class="stat-l">✅ Aprob.</div></div>
      <div class="stat-box"><div class="stat-n" style="color:var(--red)">${pendP}</div><div class="stat-l">💳 Pend.$</div></div>
    </div>
    <button class="btn btn-red" style="margin-bottom:12px" onclick="modalNuevoExamen()">+ Registrar examen</button>`;
  if(exams.length===0) h+=`<div style="text-align:center;color:var(--muted);padding:30px">Sin exámenes en este grupo</div>`;
  [...exams].reverse().forEach(ex=>{
    const a=DB.alumnos.find(x=>x.id==ex.alumnoId);
    const prom=ex.notaTec&&ex.notaAct?((+ex.notaTec+(+ex.notaAct))/2).toFixed(1):"-";
    const col=ex.resultado==="✅ Aprobado"?"#22c55e":ex.resultado==="❌ Reprobado"?"#e63946":"#f59e0b";
    h+=`<div class="card" style="border-color:${col}40;cursor:pointer" onclick="modalVerExamen(${ex.id})">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${a?a.nombre:"—"}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">${ex.fecha} · ${ex.cinturonActual||"?"}→${ex.cinturonObtener||"?"}</div>
        </div>
        <div class="ebig" style="color:${+prom>=6?"#22c55e":+prom>0?"#e63946":"var(--muted)"}">${prom}</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${tag(ex.resultado,col)} ${tag(ex.pagado?"💰 Pagado":"💳 Pend.",ex.pagado?"#22c55e":"#e63946")}</div>
    </div>`;
  });
  document.getElementById("content").innerHTML=h;
}

function formExamenHTML(ex){
  const al=DB.alumnos.filter(a=>a.grupo===examGrupo&&a.estado==="Activo");
  const prom=ex&&ex.notaTec&&ex.notaAct?((+ex.notaTec+(+ex.notaAct))/2).toFixed(1):"-";
  return `
    <div class="field"><label>Alumno *</label>
      <select id="ex-a"><option value="">Seleccionar...</option>
        ${al.map(a=>`<option value="${a.id}"${ex&&ex.alumnoId==a.id?" selected":""}>${a.nombre}</option>`).join("")}
      </select>
    </div>
    <div class="field"><label>Fecha</label><input type="date" id="ex-fecha" value="${ex&&ex.fecha||HOY}"/></div>
    <div class="g2">
      <div class="field"><label>Cinturón actual</label>${cinSel("ex-ca",ex&&ex.cinturonActual||"Blanco")}</div>
      <div class="field"><label>A obtener</label>${cinSel("ex-co",ex&&ex.cinturonObtener||"Amarillo")}</div>
    </div>
    <div class="g2">
      <div class="field"><label>Nota técnica (1-10)</label><input type="number" min="1" max="10" id="ex-tec" value="${ex&&ex.notaTec||""}" oninput="updProm()"/></div>
      <div class="field"><label>Nota actitud (1-10)</label><input type="number" min="1" max="10" id="ex-act" value="${ex&&ex.notaAct||""}" oninput="updProm()"/></div>
    </div>
    <div class="card2" style="text-align:center;margin-bottom:12px">
      <div style="font-size:10px;color:var(--muted);font-weight:700;margin-bottom:2px">PROMEDIO</div>
      <div id="pd" style="font-size:44px;font-weight:800;line-height:1;color:${+prom>=6?"#22c55e":+prom>0?"#e63946":"var(--muted)"}">${prom}</div>
    </div>
    <div class="field"><label>Resultado</label>
      <select id="ex-res">${["✅ Aprobado","❌ Reprobado","🔄 En revisión"].map(r=>`<option${ex&&ex.resultado===r?" selected":""}>${r}</option>`).join("")}</select>
    </div>
    <div class="g2">
      <div class="field"><label>Monto $</label><input type="number" id="ex-monto" value="${ex&&ex.montoPago||0}"/></div>
      <div class="field"><label>Estado pago</label>
        <select id="ex-pago"><option value="si"${ex&&ex.pagado?" selected":""}>✅ Pagado</option><option value="no"${!ex||!ex.pagado?" selected":""}>❌ Pendiente</option></select>
      </div>
    </div>
    <div class="field"><label>Observaciones</label><textarea id="ex-obs" rows="2" style="resize:none">${ex&&ex.obs||""}</textarea></div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn btn-outline" style="width:50%" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-red" style="width:50%" onclick="guardarExamen(${ex&&ex.id||0})">Guardar</button>
    </div>`;
}

function updProm(){
  const t=+document.getElementById("ex-tec")?.value,a=+document.getElementById("ex-act")?.value;
  const el=document.getElementById("pd"); if(!el) return;
  if(t&&a){const p=((t+a)/2).toFixed(1);el.textContent=p;el.style.color=p>=6?"#22c55e":"#e63946";}
  else{el.textContent="-";el.style.color="var(--muted)";}
}

function modalNuevoExamen(){openModal("Nuevo examen",formExamenHTML(null));}

function modalVerExamen(id){
  const ex=DB.examenes.find(e=>e.id===id); if(!ex) return;
  const a=DB.alumnos.find(x=>x.id==ex.alumnoId);
  const prom=ex.notaTec&&ex.notaAct?((+ex.notaTec+(+ex.notaAct))/2).toFixed(1):"-";

  openModal("Examen",`
    <div class="card2" style="margin-bottom:14px">
      <div style="font-weight:800;font-size:16px;margin-bottom:3px">${a?a.nombre:"—"}</div>
      <div style="font-size:12px;color:var(--muted)">${ex.fecha}</div>
      <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">${tag((ex.cinturonActual||"?")+"→"+(ex.cinturonObtener||"?"),"#888")} ${tag(ex.resultado,col)}</div>
    </div>
    ${[["🥋 Nota técnica",ex.notaTec||"-"],["💪 Nota actitud",ex.notaAct||"-"],["📊 Promedio",prom],["💰 Monto","$"+(ex.montoPago||0).toLocaleString()],["💳 Pago",ex.pagado?"✅ Pagado":"❌ Pendiente"],["📝 Obs.",ex.obs||"-"]].map(([l,v])=>`
      <div style="display:flex;gap:10px;margin-bottom:9px;font-size:13px">

      </div>`).join("")}
    <div class="div"></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline-red" style="width:50%" onclick="openModal('Editar examen',formExamenHTML(DB.examenes.find(e=>e.id===${id})))">✏️ Editar</button>
      <button class="btn btn-outline-red" style="width:50%" onclick="eliminarExamen(${id})">🗑 Eliminar</button>
    </div>`);
}

function guardarExamen(id){
  const g=k=>document.getElementById(k)?.value||"";
  const aid=g("ex-a"); if(!aid){alert("Seleccioná un alumno");return;}
  const obj={alumnoId:+aid,fecha:g("ex-fecha"),cinturonActual:g("ex-ca"),cinturonObtener:g("ex-co"),notaTec:g("ex-tec"),notaAct:g("ex-act"),resultado:g("ex-res"),montoPago:+g("ex-monto")||0,pagado:g("ex-pago")==="si",obs:g("ex-obs")};
  if(id){DB.examenes=DB.examenes.map(e=>e.id===id?{...e,...obj}:e);}
  else{DB.examenes.push({...obj,id:Date.now()});}
  sv("examenes"); closeModal(); renderExamenes();
}

function eliminarExamen(id){
  if(!confirm("¿Eliminar este examen?")) return;
  DB.examenes=DB.examenes.filter(e=>e.id!==id);
  sv("examenes"); closeModal(); renderExamenes();
}

// EXPORTAR EXCEL
// ══════════════════════════════════════════════════════════════════════════════
function exportarExcel(){
  const wb=XLSX.utils.book_new();
  const sede=sedeActual();

  const ah=[["#","Sede","Grupo","Nombre","Fecha Nac.","Edad","Ingreso","Cinturón","Estado","Cuota $","Teléfono","Email","Emergencia","Observaciones"]];
  DB.alumnos.forEach((a,i)=>ah.push([i+1,sede.nombre,grupoLabel(a.grupo),a.nombre,a.nac,edad(a.nac),a.ingreso,a.cinturon,a.estado,a.cuota||0,a.tel,a.email,a.emergencia,a.obs]));
  const ws1=XLSX.utils.aoa_to_sheet(ah);
  ws1["!cols"]=[5,16,14,28,14,7,14,14,12,12,16,28,22,28].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,ws1,"Alumnos");

  const claves=Object.keys(DB.pagos).sort();
  const ph=[["#","Sede","Grupo","Nombre","Cuota $",...claves.map(k=>{const[y,m]=k.split("-");return MESES[+m]+" "+y;}),"Meses Pagados","Total $"]];
  DB.alumnos.filter(a=>a.estado==="Activo").forEach((a,i)=>{
    const fila=[i+1,sede.nombre,grupoLabel(a.grupo),a.nombre,a.cuota||0];
    let mp=0,tp=0;
    claves.forEach(k=>{const est=DB.pagos[k]?.[a.id]||"❌ Pendiente";fila.push(est);if(est==="✅ Pagado"){mp++;tp+=a.cuota||0;}if(est==="🔄 Parcial"){mp+=.5;tp+=Math.round((a.cuota||0)/2);}});
    fila.push(mp,tp); ph.push(fila);
  });
  const ws2=XLSX.utils.aoa_to_sheet(ph);
  XLSX.utils.book_append_sheet(wb,ws2,"Pagos");

  const fechas=Object.keys(DB.asistencia).sort();
  const ash=[["#","Sede","Grupo","Nombre",...fechas,"Total ✅","% Asistencia"]];
  DB.alumnos.filter(a=>a.estado==="Activo").forEach((a,i)=>{
    const fila=[i+1,sede.nombre,grupoLabel(a.grupo),a.nombre];
    let pres=0;
    fechas.forEach(f=>{const est=DB.asistencia[f]?.[a.id]||"❌";fila.push(est);if(est==="✅")pres++;});
    fila.push(pres,fechas.length>0?Math.round(pres/fechas.length*100)+"%":"0%");
    ash.push(fila);
  });
  const ws3=XLSX.utils.aoa_to_sheet(ash.length>1?ash:[ash[0],["Sin registros"]]);
  XLSX.utils.book_append_sheet(wb,ws3,"Asistencia");

  const eh=[["#","Sede","Grupo","Alumno","Cinturón actual","A obtener","Fecha","Nota Técnica","Nota Actitud","Promedio","Resultado","Monto $","Pago","Observaciones"]];
  DB.examenes.forEach((ex,i)=>{
    const a=DB.alumnos.find(x=>x.id==ex.alumnoId);
    const prom=ex.notaTec&&ex.notaAct?((+ex.notaTec+(+ex.notaAct))/2).toFixed(1):"-";
    eh.push([i+1,sede.nombre,grupoLabel(a?.grupo||"ninos"),a?a.nombre:"—",ex.cinturonActual,ex.cinturonObtener,ex.fecha,ex.notaTec||"-",ex.notaAct||"-",prom,ex.resultado,ex.montoPago||0,ex.pagado?"✅ Pagado":"❌ Pendiente",ex.obs]);
  });
  const ws4=XLSX.utils.aoa_to_sheet(eh.length>1?eh:[eh[0],["Sin exámenes"]]);
  XLSX.utils.book_append_sheet(wb,ws4,"Examenes");

  const fecha=new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb,`${sede.nombre.replace(/\s+/g,"_")}_${fecha}.xlsx`);
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
function goTab(t){
  tab=t;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById("tab-"+t).classList.add("active");
  render();
}

function render(){
  if(tab==="alumnos")         renderAlumnos();
  else if(tab==="asistencia") renderAsistencia();
  else if(tab==="pagos")      renderPagos();
  else if(tab==="examenes")   renderExamenes();
}

// ── Init ──────────────────────────────────────────────────────────────────────
cargarDB();
updateHeader();
renderSedeBar();
render();
</script>
</body>
</html>
